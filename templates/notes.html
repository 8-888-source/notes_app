{% extends "base.html" %}

{% block title %}Notes{% endblock %}

{% block content %}

<div class="card p-4 shadow mb-4">

    <h3>Создать заметку</h3>

    <form method="POST">

        <input class="form-control mb-2" name="title" placeholder="Заголовок">

        <textarea class="form-control mb-2" name="content" placeholder="Текст"></textarea>

        <button class="btn btn-primary w-100">Добавить</button>

    </form>

</div>

{% for note in notes %}

<div class="card shadow mb-3 note-card">

    <div class="card-body">

        <h5>{{ note.title }}</h5>
        <p>{{ note.content }}</p>

        <a class="btn btn-sm btn-danger"
           href="/notes/delete/{{ note.id }}">
            Удалить
        </a>

    </div>

</div>

{% endfor %}

{% endblock %}
