<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>{% block title %}Notes App{% endblock %}</title>
    <meta name="google-site-verification" content="jwlW7HzPsFkft7HSFKHwskOpnGufUqernkRp3-Ssido" />
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ТВОЙ CSS (важно!) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="/notes">Notes App</a>

        <div>
            <a class="btn btn-outline-light btn-sm" href="/login">Вход</a>
            <a class="btn btn-warning btn-sm" href="/register">Регистрация</a>
            <a class="btn btn-danger btn-sm" href="/logout">Выход</a>
        </div>
    </nav>

    <div class="container mt-4">

        {% block content %}
        {% endblock %}

    </div>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
