{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="card p-4 shadow">

    <h3 class="mb-3">Регистрация</h3>

    <form method="POST">

        <input class="form-control mb-2" name="username" placeholder="Имя">

        <input class="form-control mb-2" name="email" placeholder="Email">

        <input class="form-control mb-2" name="password" type="password" placeholder="Пароль">

        <button class="btn btn-success w-100">Создать аккаунт</button>

    </form>

</div>

{% endblock %}
